spring.application.name=carrinhoPraiagp02
spring.profiles.default=dev
app.security.enabled=true
spring.datasource.url=${APP_DB_URL:jdbc:h2:file:${user.home}/.dinhos/carrinho}
spring.datasource.driver-class-name=${APP_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${APP_DB_USERNAME:sa}
spring.datasource.password=${APP_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
server.servlet.session.cookie.same-site=lax
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:admin@localhost}
# Local development only; override this value and disable bootstrap outside development.
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.payment.simulation.approved=${APP_PAYMENT_SIMULATION_APPROVED:true}
app.public-base-url=${APP_PUBLIC_BASE_URL:}
app.test-orders.enabled=${APP_TEST_ORDERS_ENABLED:true}
