spring.application.name=carrinhoPraiagp02
spring.profiles.default=dev
app.security.enabled=true
spring.datasource.url=jdbc:h2:mem:carrinho;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
server.servlet.session.cookie.same-site=lax
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
app.bootstrap-admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap-admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:admin@localhost}
# Local development only; override this value and disable bootstrap outside development.
app.bootstrap-admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.payment.simulation.approved=${APP_PAYMENT_SIMULATION_APPROVED:true}
